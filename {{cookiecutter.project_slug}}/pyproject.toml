[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "sequana-{{cookiecutter.name}}"
version = "3.0.0"
description = "{{cookiecutter.description}}"
authors = ["Sequana Team"]
license = "BSD-3"
repository = "https://github.com/sequana/sequana_{{cookiecutter.name}}"
readme = "README.rst"
keywords = ['{{cookiecutter.keywords}}']
classifiers = [
        "Development Status :: 4 - Beta",
        #"Development Status :: 5 - Production/Stable",
        "Intended Audience :: Education",
        "Intended Audience :: End Users/Desktop",
        "Intended Audience :: Developers",
        "Intended Audience :: Science/Research",
        "License :: OSI Approved :: BSD License",
        "Operating System :: POSIX :: Linux",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Topic :: Software Development :: Libraries :: Python Modules",
        "Topic :: Scientific/Engineering :: Bio-Informatics",
        "Topic :: Scientific/Engineering :: Information Analysis",
]

packages = [
    {include = "sequana_pipelines"}
]


[tool.poetry.dependencies]
python = ">=3.10,<4.0"
sequana = ">=0.17.0"
sequana_pipetools = ">=1.0.0"
click-completion = "^0.5.2"


[tool.poetry.scripts]
sequana_{{cookiecutter.name}} = "sequana_pipelines.{{cookiecutter.name}}.main:main"


[tool.poetry.group.dev.dependencies]
black = "^23.7.0"
pytest = "^7.4.0"
mock = "^5.1.0"
pytest-mock = "^3.11.1"
pytest-cov = "^4.1.0"

